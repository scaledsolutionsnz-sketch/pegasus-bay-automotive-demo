<!DOCTYPE html>
<html lang="en-NZ">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Leave a Review | Pegasus Bay Automotive</title>
<meta name="description" content="Tell us how we did at Pegasus Bay Automotive, Kaiapoi." />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='14' fill='%23ff5c1a'/><text x='50' y='72' font-size='62' font-family='Arial' font-weight='bold' fill='white' text-anchor='middle'>P</text></svg>" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>

<nav class="nav">
  <div class="wrap">
    <a class="brand" href="index.html"><span class="mark">P</span><span><b>Pegasus Bay</b><span>Automotive</span></span></a>
    <div class="nav-links"><a class="nav-cta" href="tel:+642041047419">020 4104 7419</a></div>
  </div>
</nav>

<div class="rev-wrap">
  <p class="eyebrow">Your feedback</p>
  <h1>How did we do?</h1>
  <p>Tap a star to rate your experience with Pegasus Bay Automotive.</p>
  <div class="starpick">
    <button data-rating="5" aria-label="5 stars">★</button>
    <button data-rating="4" aria-label="4 stars">★</button>
    <button data-rating="3" aria-label="3 stars">★</button>
    <button data-rating="2" aria-label="2 stars">★</button>
    <button data-rating="1" aria-label="1 star">★</button>
  </div>
  <p class="hint">Your honest feedback helps us keep North Canterbury on the road.</p>
</div>

<script>
  // 4-5 stars -> Google review. 1-3 stars -> private feedback form.
  var GOOGLE_REVIEW_URL = "https://g.page/r/PLACEHOLDER";
  document.querySelectorAll('.starpick button').forEach(function (b) {
    b.addEventListener('click', function () {
      var r = parseInt(b.getAttribute('data-rating'), 10);
      if (r >= 4) { window.location.href = GOOGLE_REVIEW_URL; }
      else { window.location.href = "private.html?rating=" + r; }
    });
  });
</script>
</body>
</html>
